[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rag-audit"
version = "0.1.0"
description = "Synthetic-data RAG audit demonstration foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
embeddings = ["onnxruntime==1.30.0", "tokenizers==0.23.2", "numpy==2.5.3"]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "pyyaml>=6,<7",
    "ruff>=0.9,<1",
    "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: requires a configured PostgreSQL database with vector enabled", "model: explicit local real-model smoke", "live: opt-in real provider; requires environment key"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["numpy", "onnxruntime", "tokenizers"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["rag_audit"]

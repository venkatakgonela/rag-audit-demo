services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run make setup first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
      POSTGRES_DB: ${POSTGRES_DB:?Run make setup first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init/001-enable-vector.sql:/docker-entrypoint-initdb.d/001-enable-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:

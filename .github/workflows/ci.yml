name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.3"
          python-version: "3.12"
      - run: make setup
      - run: make lint
      - run: make typecheck
      - run: make test

  integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: synthetic_demo
          POSTGRES_PASSWORD: synthetic_local_only
          POSTGRES_DB: synthetic_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic_demo -d synthetic_demo"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://synthetic_demo:synthetic_local_only@127.0.0.1:5432/synthetic_demo
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.3"
          python-version: "3.12"
      - run: make setup
      - run: make db-init
      - run: make test-integration
